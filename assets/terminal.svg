<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-label="Animated Linux terminal profile">
  <rect width="980" height="360" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="978" height="358" rx="15" fill="none" stroke="#30363d"/>

  <circle cx="28" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="25" r="6" fill="#27c93f"/>
  <text x="490" y="30" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, Fira Code, monospace" font-size="14">clone4truth@redteam:~</text>
  <line x1="0" y1="48" x2="980" y2="48" stroke="#21262d"/>

  <style>
    text { font-family: JetBrains Mono, Fira Code, Consolas, monospace; font-size: 20px; }
    .prompt { fill: #ff5c5c; font-weight: 700; }
    .cmd { fill: #f0f6fc; }
    .out { fill: #8b949e; }
    .accent { fill: #7ee787; }
    .line { opacity: 0; animation: reveal 12s linear infinite; }
    .l1 { animation-delay: 0s; }
    .l2 { animation-delay: .8s; }
    .l3 { animation-delay: 2.2s; }
    .l4 { animation-delay: 3s; }
    .l5 { animation-delay: 5s; }
    .l6 { animation-delay: 5.8s; }
    .l7 { animation-delay: 8s; }
    .l8 { animation-delay: 8.8s; }
    .cursor { animation: blink 1s steps(1,end) infinite; }
    @keyframes reveal {
      0%, 3% { opacity: 0; transform: translateY(2px); }
      6%, 88% { opacity: 1; transform: translateY(0); }
      94%, 100% { opacity: 0; }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <g class="line l1">
    <text x="28" y="86"><tspan class="prompt">$</tspan><tspan class="cmd"> whoami</tspan></text>
  </g>
  <g class="line l2">
    <text x="28" y="116" class="accent">C4T / clone4truth</text>
  </g>

  <g class="line l3">
    <text x="28" y="158"><tspan class="prompt">$</tspan><tspan class="cmd"> cat mission.txt</tspan></text>
  </g>
  <g class="line l4">
    <text x="28" y="188" class="out">Break assumptions. Test defenses. Build better systems.</text>
  </g>

  <g class="line l5">
    <text x="28" y="230"><tspan class="prompt">$</tspan><tspan class="cmd"> cat scope.txt</tspan></text>
  </g>
  <g class="line l6">
    <text x="28" y="260" class="out">Red Teaming | Web &amp; API Security | Adversary Emulation | Security Automation</text>
  </g>

  <g class="line l7">
    <text x="28" y="302"><tspan class="prompt">$</tspan><tspan class="cmd"> echo $ENGAGEMENT_MODE</tspan></text>
  </g>
  <g class="line l8">
    <text x="28" y="332" class="accent">authorized-research / lab / CTF</text>
  </g>

  <rect class="cursor" x="365" y="314" width="10" height="20" fill="#f0f6fc" rx="1"/>
</svg>
